name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v4.2.2)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - prerelease
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish ${{ matrix.arch }}
        run: |
          dotnet publish EasyKit/EasyKit.csproj `
            --configuration Release `
            --runtime win-${{ matrix.arch }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:ContinuousIntegrationBuild=true `
            -o ./publish/win-${{ matrix.arch }}

      - name: Verify publish output
        run: |
          Write-Output "Published files for ${{ matrix.arch }}:"
          Get-ChildItem ./publish/win-${{ matrix.arch }} | Select-Object Name, Length
          if (-not (Test-Path "./publish/win-${{ matrix.arch }}/EasyKit.exe")) {
            throw "EasyKit.exe not found in publish output"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.arch }}
          path: ./publish/win-${{ matrix.arch }}
          retention-days: 1

  package:
    name: Package Installer
    runs-on: windows-latest
    needs: build
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-x64
          path: ./publish/win-x64

      - name: Download x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-x86
          path: ./publish/win-x86

      - name: Determine version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.release_version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = (Select-String -Path EasyKit/EasyKit.csproj -Pattern '<FileVersion>(.*?)</FileVersion>' -AllMatches).Matches.Groups[1].Value
          }
          Write-Output "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "Detected version: $version"

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          Write-Output "Inno Setup installed"

      - name: Compile x64 installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup not found at $iscc"
          }
          & $iscc /DMySourcePath="$env:GITHUB_WORKSPACE\ISS" /DMyAppVersion="${{ steps.version.outputs.version }}" ISS/Release-win-x64.iss
          if ($LASTEXITCODE -ne 0) {
            throw "x64 installer compilation failed"
          }

      - name: Compile x86 installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMySourcePath="$env:GITHUB_WORKSPACE\ISS" /DMyAppVersion="${{ steps.version.outputs.version }}" ISS/Release-win-x86.iss
          if ($LASTEXITCODE -ne 0) {
            throw "x86 installer compilation failed"
          }

      - name: Verify installers
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $x64Installer = "EasyKit-${version}-x64.exe"
          $x86Installer = "EasyKit-${version}-x86.exe"

          Write-Output "Checking for installers..."
          Get-ChildItem EasyKit-*.exe | Select-Object Name, @{Name='SizeMB';Expression={[math]::Round($_.Length/1MB, 2)}}

          if (-not (Test-Path $x64Installer)) {
            throw "x64 installer not found: $x64Installer"
          }
          if (-not (Test-Path $x86Installer)) {
            throw "x86 installer not found: $x86Installer"
          }
          Write-Output "Both installers verified successfully"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: EasyKit ${{ steps.version.outputs.version }}
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          generate_release_notes: true
          files: |
            EasyKit-${{ steps.version.outputs.version }}-x64.exe
            EasyKit-${{ steps.version.outputs.version }}-x86.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
